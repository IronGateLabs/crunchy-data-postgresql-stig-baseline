name: Coverage & SonarCloud

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    name: Unit tests, Codecov & SonarCloud
    runs-on: ubuntu-latest
    env:
      CHEF_LICENSE: accept-silent
      # Mapped to env so steps can be gated on the secret being configured;
      # before the fork owner adds these secrets the optional steps are skipped
      # rather than failing the build.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Run unit tests with coverage
        run: bundle exec rake test

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      # TEMPORARY: the SonarCloud UI toggle would not disable Automatic Analysis
      # (sonar.autoscan.enabled was true at project + org), so disable it via the
      # API before scanning. Remove this step once a CI scan has succeeded.
      - name: Disable SonarCloud Automatic Analysis
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          read_val() { curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/settings/values?$1" | python3 -c 'import sys,json;d=json.load(sys.stdin);print(next((s.get("value") for s in d.get("settings",[]) if s["key"]=="sonar.autoscan.enabled"),"unset"))'; }
          echo "before: project=$(read_val component=IronGateLabs_crunchy-data-postgresql-stig-baseline) org=$(read_val organization=irongatelabs)"
          curl -s -u "$SONAR_TOKEN:" -X POST "https://sonarcloud.io/api/settings/set" \
            --data-urlencode "key=sonar.autoscan.enabled" --data-urlencode "value=false" \
            --data-urlencode "component=IronGateLabs_crunchy-data-postgresql-stig-baseline" -w "set(project) HTTP %{http_code}\n"
          curl -s -u "$SONAR_TOKEN:" -X POST "https://sonarcloud.io/api/settings/set" \
            --data-urlencode "key=sonar.autoscan.enabled" --data-urlencode "value=false" \
            --data-urlencode "organization=irongatelabs" -w "set(org) HTTP %{http_code}\n"
          echo "after: project=$(read_val component=IronGateLabs_crunchy-data-postgresql-stig-baseline) org=$(read_val organization=irongatelabs)"

      # TEMPORARY continue-on-error: the SonarCloud project still has "Automatic
      # Analysis" enabled, which conflicts with this CI scan. Once it is disabled
      # (Administration > Analysis Method) and a scan succeeds, remove this line
      # to make the gate blocking.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
