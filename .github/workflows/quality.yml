name: Coverage & SonarCloud

on:
  push:
    branches: [main]
  pull_request:

jobs:
  coverage:
    name: Unit tests, Codecov & SonarCloud
    runs-on: ubuntu-latest
    env:
      CHEF_LICENSE: accept-silent
      # Mapped to env so steps can be gated on the secret being configured;
      # before the fork owner adds these secrets the optional steps are skipped
      # rather than failing the build.
      CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Run unit tests with coverage
        run: bundle exec rake test

      - name: Upload coverage to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v4
        with:
          files: coverage/lcov.info
          fail_ci_if_error: false

      # TEMPORARY diagnostic: report the server-side analysis-method setting so we
      # can confirm whether Automatic Analysis is actually disabled. Remove once
      # the CI scan succeeds.
      - name: Diagnose SonarCloud analysis method
        if: ${{ env.SONAR_TOKEN != '' }}
        run: |
          for scope in "component=IronGateLabs_crunchy-data-postgresql-stig-baseline" "organization=irongatelabs"; do
            echo "--- $scope ---"
            curl -s -u "$SONAR_TOKEN:" "https://sonarcloud.io/api/settings/values?$scope" \
              | python3 -c 'import sys,json; d=json.load(sys.stdin); rows=[(s["key"], s.get("value", s.get("values"))) for s in d.get("settings",[]) if "autoscan" in s["key"].lower()]; print("\n".join(f"{k} = {v}" for k,v in rows) or "no autoscan setting at this scope")'
          done

      # TEMPORARY continue-on-error: the SonarCloud project still has "Automatic
      # Analysis" enabled, which conflicts with this CI scan. Once it is disabled
      # (Administration > Analysis Method) and a scan succeeds, remove this line
      # to make the gate blocking.
      - name: SonarCloud scan
        if: ${{ env.SONAR_TOKEN != '' }}
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_HOST_URL: https://sonarcloud.io
