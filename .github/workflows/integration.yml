name: Integration tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vanilla:
    name: Vanilla state threshold
    runs-on: ubuntu-latest
    env:
      CHEF_LICENSE: accept-silent
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.1'
          bundler-cache: true

      - name: Start PostgreSQL test database
        run: docker compose up -d

      - name: Wait for PostgreSQL to be ready
        run: |
          for _ in $(seq 1 30); do
            if docker compose exec -T db pg_isready -U testuser -d testdb; then exit 0; fi
            sleep 2
          done
          echo "PostgreSQL did not become ready in time" >&2
          exit 1

      - name: Run the profile against the vanilla state
        run: |
          mkdir -p results
          bundle exec inspec exec . \
            --input-file inputs_postgres14_example.yml \
            --reporter cli json:results/vanilla.json || true

      - name: Validate results against the vanilla threshold
        uses: mitre/saf_action@v1
        with:
          command_string: "validate threshold -i results/vanilla.json -F test/integration/vanilla.threshold.yml"

      - name: Upload vanilla results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vanilla-results
          path: results/vanilla.json

      - name: Tear down
        if: always()
        run: docker compose down -v
