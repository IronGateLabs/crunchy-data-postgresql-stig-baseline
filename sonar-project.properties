# SonarCloud configuration. The fork owner must create the project in
# SonarCloud and confirm these keys match (org + project key are account-specific).
sonar.organization=irongatelabs
sonar.projectKey=IronGateLabs_crunchy-data-postgresql-stig-baseline

sonar.sources=controls,libraries
sonar.tests=test
sonar.sourceEncoding=UTF-8

# SonarCloud's Ruby sensor reads SimpleCov's JSON formatter output
# (coverage/coverage.json), not lcov (lcov is what we feed Codecov).
sonar.ruby.coverage.reportPaths=coverage/coverage.json

# Controls are declarative InSpec DSL: they are not unit-tested (coverage is
# meaningless) and are intentionally repetitive (the same describe/tag
# boilerplate per control). Exclude them from the coverage and duplication
# quality-gate metrics so the gate reflects the testable Ruby (libraries/).
sonar.coverage.exclusions=controls/**,test/**
sonar.cpd.exclusions=controls/**
